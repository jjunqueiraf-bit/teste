<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img"
 aria-label="Why a Mars launch must wait for the transfer window">
<rect width="460" height="300" fill="#05070f"/>
<circle cx="232" cy="158" r="58" fill="none" stroke="#2f4a7a" stroke-width="1.5"/>
<circle cx="232" cy="158" r="100" fill="none" stroke="#7a3f2a" stroke-width="1.5"/>
<path d="M 174 158 A 79.0 76.2 0 0 1 332 158" fill="none"
 stroke="#4fd1a5" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="326,149 337,156 326,163" fill="#4fd1a5"/>
<circle cx="232" cy="158" r="10" fill="#ffc93c"/>
<text x="232" y="183" fill="#ffc93c" font-size="10.5" text-anchor="middle" font-family="monospace">SUN</text>
<circle cx="174" cy="158" r="7" fill="#5aa9ff"/>
<text x="165" y="148" fill="#9fd0ff" font-size="11" text-anchor="end" font-family="monospace">EARTH</text>
<text x="165" y="162" fill="#6f87ad" font-size="9.5" text-anchor="end" font-family="monospace">at launch</text>
<circle cx="160.1" cy="88.5" r="7" fill="#c0603a"/>
<text x="154.1" y="76.5" fill="#ff9b6a" font-size="11" text-anchor="end" font-family="monospace">MARS today</text>
<circle cx="332" cy="158" r="7" fill="#c0603a" opacity="0.4"/>
<circle cx="332" cy="158" r="12" fill="none" stroke="#4fd1a5" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="316" y="184" fill="#4fd1a5" font-size="10.5" text-anchor="middle" font-family="monospace">MARS arrives</text>
<text x="316" y="196" fill="#4fd1a5" font-size="10.5" text-anchor="middle" font-family="monospace">here, day 259</text>
<text x="16" y="24" fill="#e8eeff" font-size="13" font-family="monospace">YOU DO NOT AIM AT MARS.</text>
<text x="16" y="40" fill="#8fa0c4" font-size="11" font-family="monospace">You aim at where Mars will be.</text>
<text x="16" y="248" fill="#4fd1a5" font-size="10.5" font-family="monospace">- - -  the transfer orbit: half a lap of the Sun, about 259 days</text>
<text x="16" y="263" fill="#6f87ad" font-size="10" font-family="monospace">Mars only sits in the right spot about every 26 months.</text>
</svg>